<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오대륙전기 — 게임 플레이</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;900&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a08;min-height:100vh}
.root{font-family:'Noto Sans KR',sans-serif;background:#0a0a08;color:#c8b97a;padding:16px;max-width:680px;margin:0 auto}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.hud-block{border:1px solid #2a2518;background:#0e0e0b;padding:8px 10px}
.hud-label{font-size:9px;letter-spacing:0.25em;color:#5a5130;margin-bottom:4px;font-family:'Noto Sans KR',sans-serif}
.hud-val{font-size:15px;font-weight:600;color:#e8d48a;font-family:'Noto Serif KR',serif}
.hp-bar{height:3px;background:#1a1810;margin-top:5px;border-radius:1px}
.hp-fill{height:100%;background:#5dcaa5;border-radius:1px;transition:width 0.5s}
.hp-fill.low{background:#e06060}
.mp-bar{height:3px;background:#1a1820;margin-top:3px;border-radius:1px}
.mp-fill{height:100%;background:#6a8adc;border-radius:1px;transition:width 0.5s}
.hud-sub{font-size:9px;color:#5a5a80;margin-top:2px}
.lv-badge{font-size:9px;color:#c8b97a55;letter-spacing:0.15em}
.status-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stag{font-size:9px;padding:1px 6px;border:1px solid #3a3018;color:#8a7e52;font-family:'Noto Sans KR',sans-serif}

/* 스토리 */
.story-wrap{border:1px solid #2a2518;background:#0a0a07;padding:14px 16px;margin-bottom:12px;min-height:180px}
.story-chapter{font-size:10px;letter-spacing:0.35em;color:#5a5130;margin-bottom:10px;font-family:'Noto Serif KR',serif}
.story-text{font-size:13px;color:#b8a86a;line-height:2;font-family:'Noto Serif KR',serif;word-break:keep-all}
.story-text p{margin-bottom:1em}
.story-text p:last-child{margin-bottom:0}

/* 로딩 */
.loading-dots{display:inline-flex;gap:4px;padding:8px 0}
.ld{width:5px;height:5px;border-radius:50%;background:#c8b97a44;animation:ldpulse 1.2s ease infinite}
.ld:nth-child(2){animation-delay:0.2s}
.ld:nth-child(3){animation-delay:0.4s}
@keyframes ldpulse{0%,100%{background:#c8b97a22}50%{background:#c8b97a}}

/* 선택지 */
.choices{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.choice-btn{border:1px solid #2a2518;background:#0e0e0b;padding:11px 14px;cursor:pointer;text-align:left;font-family:'Noto Serif KR',serif;font-size:12px;color:#9a8e52;letter-spacing:0.05em;line-height:1.6;transition:all 0.15s;display:flex;gap:10px;align-items:flex-start;width:100%}
.choice-btn:hover{border-color:#c8b97a55;background:#111109;color:#c8b97a}
.choice-btn:disabled{opacity:0.3;cursor:default}
.choice-num{font-size:11px;color:#5a5130;flex-shrink:0;margin-top:1px;font-family:'Noto Sans KR',sans-serif}

/* 하단 입력 */
.bottom-row{display:flex;gap:8px;align-items:center}
.input-wrap{flex:1;border:1px solid #2a2518;background:#0e0e0b;display:flex;align-items:center;gap:8px;padding:0 10px}
.free-input{flex:1;background:transparent;border:none;outline:none;color:#c8b97a;font-family:'Noto Serif KR',serif;font-size:12px;padding:10px 0;letter-spacing:0.05em}
.free-input::placeholder{color:#3a3218}
.send-btn{background:transparent;border:none;cursor:pointer;color:#5a5130;font-size:18px;line-height:1;padding:0;transition:color 0.15s}
.send-btn:hover{color:#c8b97a}
.menu-btn{padding:9px 14px;background:#0e0e0b;border:1px solid #2a2518;color:#5a5030;font-family:'Noto Sans KR',sans-serif;font-size:11px;cursor:pointer;white-space:nowrap}
.menu-btn:hover{border-color:#5a4e28;color:#8a7e52}

/* 로그 */
.log-wrap{border-top:1px solid #1a1810;margin-top:10px;padding-top:10px;display:none}
.log-wrap.open{display:block}
.log-item{font-size:11px;color:#4a4428;padding:5px 0;border-bottom:1px solid #141410;font-family:'Noto Serif KR',serif;line-height:1.6}
.log-item:last-child{border-bottom:none}
.log-choice{color:#6a6040}

/* API 키 설정 */
.api-setup{border:1px solid #3a3018;background:#0e0e08;padding:14px 16px;margin-bottom:12px}
.api-setup p{font-size:11px;color:#6a6040;margin-bottom:8px;font-family:'Noto Sans KR',sans-serif;line-height:1.6}
.api-input-row{display:flex;gap:8px}
.api-input{flex:1;background:#141410;border:1px solid #3a3018;color:#c8b97a;font-family:monospace;font-size:11px;padding:8px 10px;outline:none}
.api-input:focus{border-color:#c8b97a55}
.api-btn{padding:8px 16px;background:#141410;border:1px solid #5a4e28;color:#9a8e52;font-family:'Noto Sans KR',sans-serif;font-size:11px;cursor:pointer;white-space:nowrap}
.api-btn:hover{border-color:#c8b97a;color:#c8b97a}

/* Firebase 인증 바 */
.auth-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border:1px solid #2a2518;background:#0e0e0b;margin-bottom:12px;font-family:'Noto Sans KR',sans-serif}
.auth-left{display:flex;align-items:center;gap:8px}
.auth-info{font-size:10px;color:#5a5130}
.auth-info.on{color:#5dcaa5}
.save-status{font-size:9px;color:#3a3830;transition:color 0.3s}
.save-status.ok{color:#5dcaa5}
.save-status.err{color:#e06060}
/* 이어하기 배너 */
.resume-banner{display:none;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid #4a6a4a;background:#0a1a0a;margin-bottom:12px;font-family:'Noto Sans KR',sans-serif;gap:8px}
.resume-banner.show{display:flex}
.resume-msg{font-size:11px;color:#7acaa0;flex:1}
.resume-btns{display:flex;gap:6px;flex-shrink:0}
.resume-yes{font-size:10px;padding:4px 12px;background:#0a2a1a;border:1px solid #5dcaa5;color:#5dcaa5;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.resume-yes:hover{background:#0a3a2a}
.resume-no{font-size:10px;padding:4px 10px;background:transparent;border:1px solid #3a3018;color:#5a5130;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.resume-no:hover{border-color:#6a6040;color:#8a7e52}
.auth-btn{font-size:10px;padding:4px 10px;background:#141410;border:1px solid #3a3018;color:#8888dd;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.auth-btn:hover{border-color:#8888dd;color:#aaaaee}

/* 생물 이미지 패널 */
.story-body{display:flex;gap:12px;align-items:flex-start}
.story-text{flex:1;min-width:0}
.creature-panel{width:148px;flex-shrink:0;border:1px solid #2a2518;background:#080806;display:none}
.creature-panel.show{display:block}
.creature-panel img{width:100%;display:block;opacity:0.92}
.creature-panel-info{padding:6px 8px;border-top:1px solid #1a1810}
.creature-panel-name{font-size:10px;color:#c8b97a;font-family:'Noto Serif KR',serif;line-height:1.4}
.creature-panel-en{font-size:8px;color:#4a4428;letter-spacing:0.1em;margin-top:1px}
.creature-panel-stats{font-size:9px;color:#5a5130;margin-top:5px;line-height:1.6}

/* 전투 턴 스트립 */
.turn-strip{display:none;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.turn-strip.show{display:flex}
.turn-card{flex-shrink:0;width:64px;opacity:0.38;transition:opacity 0.3s,border-color 0.3s;text-align:center;border:1px solid #1a1810;background:#090907}
.turn-card.active{opacity:1;border-color:#c8b97a88}
.turn-card.player{border-color:#2a3828}
.turn-card.active.player{border-color:#5dcaa5}
.turn-card.companion{border-color:#2a2845}
.turn-card.active.companion{border-color:#8888dd}
.turn-card.down{opacity:0.2;filter:grayscale(0.8)}
.turn-card img{width:100%;height:72px;object-fit:cover;object-position:top center;display:block}
.turn-card-name{font-size:8px;color:#5a5130;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Noto Sans KR',sans-serif}
.turn-card.active .turn-card-name{color:#c8b97a}
.turn-card.active.player .turn-card-name{color:#5dcaa5}
.turn-hp{height:2px;background:#1a1810;margin:0 4px 3px}
.turn-hp-fill{height:100%;background:#5dcaa5;transition:width 0.4s}
.turn-hp-fill.enemy{background:#e06060}
.turn-hp-fill.comp{background:#8888dd}
.turn-badge{font-size:7px;padding:1px 3px;background:#1a1810;color:#3a3820;display:inline-block;margin-bottom:2px;font-family:monospace}
.turn-card.active .turn-badge{background:#c8b97a22;color:#c8b97a88}

/* AI 제공자 선택 */
.provider-tabs{display:flex;gap:6px;margin-bottom:10px}
.ptab{padding:5px 14px;background:#141410;border:1px solid #3a3018;color:#6a6040;font-family:'Noto Sans KR',sans-serif;font-size:11px;cursor:pointer;transition:all 0.15s}
.ptab:hover{border-color:#5a4e28;color:#8a7e52}
.ptab.on{border-color:#c8b97a;color:#c8b97a;background:#1a1810}
.free-tag{font-size:8px;padding:1px 4px;background:#0a1f0a;border:1px solid #1a4a1a;color:#5dcaa5;margin-left:3px;vertical-align:middle}
.provider-desc{font-size:11px;color:#6a6040;margin-bottom:8px;font-family:'Noto Sans KR',sans-serif;line-height:1.6}
</style>
</head>
<body>
<div class="root">

  <!-- API 키 설정 -->
  <div class="api-setup" id="api-setup">
    <div class="provider-tabs">
      <button class="ptab on" data-p="claude">Claude</button>
      <button class="ptab" data-p="groq">Groq<span class="free-tag">무료</span></button>
      <button class="ptab" data-p="gemini">Gemini<span class="free-tag">무료</span></button>
      <button class="ptab" data-p="openai">GPT</button>
    </div>
    <p class="provider-desc" id="provider-desc">풍부한 서사와 창의적 묘사에 강합니다. API 키는 console.anthropic.com에서 발급.</p>
    <div class="api-input-row">
      <input class="api-input" id="api-key-input" type="password" placeholder="sk-ant-...">
      <button class="api-btn" id="api-save-btn">저장 후 시작</button>
    </div>
  </div>

  <!-- Firebase 인증 바 -->
  <div class="auth-bar" id="auth-bar">
    <div class="auth-left">
      <span class="auth-info" id="auth-info">로그인하면 게임이 자동 저장되어 다른 기기에서도 이어서 할 수 있습니다.</span>
      <span class="save-status" id="save-status"></span>
    </div>
    <button class="auth-btn" id="auth-btn">Google로 로그인</button>
  </div>

  <!-- 이어하기 배너 -->
  <div class="resume-banner" id="resume-banner">
    <span class="resume-msg" id="resume-msg">저장된 진행 상황이 있습니다.</span>
    <div class="resume-btns">
      <button class="resume-yes" id="resume-yes">이어하기</button>
      <button class="resume-no" id="resume-no">무시</button>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-block">
      <div class="hud-label">HP</div>
      <div class="hud-val" id="hud-hp">100 / 100</div>
      <div class="hp-bar"><div class="hp-fill" id="hp-bar" style="width:100%"></div></div>
      <div class="hud-sub">MP <span id="hud-mp">— / —</span></div>
      <div class="mp-bar"><div class="mp-fill" id="mp-bar" style="width:100%"></div></div>
    </div>
    <div class="hud-block">
      <div class="hud-label">캐릭터</div>
      <div class="hud-val" id="hud-char" style="font-size:12px">—</div>
      <div id="hud-cont" style="font-size:9px;color:#5a5130;margin-top:3px">—</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">레벨 / 상태</div>
      <div class="lv-badge" id="hud-lv">Lv 1</div>
      <div class="hud-sub" id="hud-xp">XP 0 / 300</div>
      <div class="status-tags" id="status-tags"><span class="stag">정상</span></div>
    </div>
  </div>

  <!-- 전투 턴 스트립 -->
  <div class="turn-strip" id="turn-strip"></div>

  <!-- 스토리 -->
  <div class="story-wrap">
    <div class="story-chapter" id="chapter-label">— 대기 중 —</div>
    <div class="story-body">
      <div class="story-text" id="story-text">
        <div class="loading-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
      </div>
      <div class="creature-panel" id="creature-panel">
        <img id="creature-img" src="" alt="">
        <div class="creature-panel-info">
          <div class="creature-panel-name" id="creature-panel-name"></div>
          <div class="creature-panel-en" id="creature-panel-en"></div>
          <div class="creature-panel-stats" id="creature-panel-stats"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 선택지 -->
  <div class="choices" id="choices"></div>

  <!-- 하단 -->
  <div class="bottom-row">
    <div class="input-wrap">
      <input class="free-input" id="free-input" placeholder="직접 행동을 입력하세요...">
      <button class="send-btn" id="send-btn">↵</button>
    </div>
    <button class="menu-btn" id="log-toggle">기록 ▾</button>
    <button class="menu-btn" id="apikey-btn">API 키</button>
    <button class="menu-btn" onclick="window.location.href='01_character_select.html'">처음으로</button>
  </div>

  <div class="log-wrap" id="log-wrap">
    <div id="log-list"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<!-- 세계관 설정 -->
<script src="lore_terra_nova.js"></script>
<script src="lore_characters.js"></script>
<script src="lore_combat_rules.js"></script>
<script src="lore_dnd_rules.js"></script>
<script src="lore_jobs_levels.js"></script>
<script src="lore_companions.js"></script>

<script>
// URL 파라미터에서 캐릭터 정보 읽기
const params = new URLSearchParams(window.location.search);

// 대륙/직업 데이터
const CONTS=[
  {id:'magic',  name:{ko:'마법 대륙',  en:'Arcania', zh:'魔法大陆',ja:'魔法大陸',  vi:'Đại Lục Ma Pháp'},bonus:{지력:2,지혜:1}},
  {id:'science',name:{ko:'과학 대륙',  en:'Mechanica',zh:'科学大陆',ja:'科学大陸',  vi:'Đại Lục Khoa Học'},bonus:{지력:2,체력:1}},
  {id:'wuxia',  name:{ko:'무협 대륙',  en:'Wuxia',   zh:'武侠大陆',ja:'武侠大陸',  vi:'Đại Lục Võ Hiệp'},bonus:{근력:1,민첩:2}},
  {id:'psychic',name:{ko:'초능력 대륙',en:'Psychia', zh:'超能大陆',ja:'超能力大陸',vi:'Đại Lục Siêu Năng'},bonus:{지혜:2,민첩:1}},
];
const JOBS={
  magic:[
    {id:'kn',role:{ko:'전사형',en:'Warrior'}, name:{ko:'마법 기사',  en:'Magic Knight'},   desc:{ko:'갑옷에 마법을 새겨 싸우는 전사.',         en:'Warrior who inscribes magic into armor.'}},
    {id:'am',role:{ko:'마법형',en:'Mage'},    name:{ko:'대마법사',   en:'Archmage'},        desc:{ko:'낮은 전투력, 강력한 광역 주문.',           en:'Low combat, powerful area spells.'}},
    {id:'ma',role:{ko:'도적형',en:'Rogue'},   name:{ko:'마법 암살자',en:'Spell Assassin'},  desc:{ko:'은신 마법과 단검의 결합.',                 en:'Combines stealth magic with daggers.'}},
    {id:'hl',role:{ko:'지원형',en:'Support'}, name:{ko:'성약사',     en:'Sanctum Healer'},  desc:{ko:'치유 마법과 약초 지식 겸비.',              en:'Combines healing magic with herbalism.'}},
    {id:'fb',role:{ko:'특수 — 희귀',en:'Special'},name:{ko:'금서 사용자',en:'Forbidden Arts'},desc:{ko:'금지된 농경 마법서를 아는 자.',           en:'Knows the forbidden agrarian grimoire.'}},

    {id:'iv',role:{ko:'기술형',en:'Tech'},    name:{ko:'발명가', en:'Inventor'},     desc:{ko:'현장 즉흥 발명가.',                   en:'Improvises inventions on the field.'}},
    {id:'hk',role:{ko:'도적형',en:'Rogue'},   name:{ko:'해커',   en:'Hacker'},       desc:{ko:'기계·정보망 침투 전문.',               en:'Specialist in machine & network infiltration.'}},
    {id:'md',role:{ko:'지원형',en:'Support'}, name:{ko:'의무병', en:'Field Medic'},  desc:{ko:'전장 응급처치 전문.',                  en:'Field emergency medical specialist.'}},
    {id:'nw',role:{ko:'특수 — 희귀',en:'Special'},name:{ko:'새사람',en:'New Human'}, desc:{ko:'인간-기계 혼합체 실험체.',             en:'Human-machine hybrid experiment subject.'}},
  ],
  wuxia:[
    {id:'sw',role:{ko:'전사형',en:'Warrior'}, name:{ko:'검객',      en:'Swordsman'},  desc:{ko:'검술·내공 겸비 정통 무인.',           en:'Orthodox warrior combining swordsmanship and inner force.'}},
    {id:'sc',role:{ko:'마법형',en:'Mage'},    name:{ko:'술사',      en:'Elementalist'},desc:{ko:'오행의 기를 다루는 도사.',            en:'Taoist who wields the five elemental forces.'}},
    {id:'jk',role:{ko:'도적형',en:'Rogue'},   name:{ko:'자객',      en:'Assassin'},   desc:{ko:'경공·암기 결합 암살자.',              en:'Assassin combining qinggong and hidden weapons.'}},
    {id:'us',role:{ko:'지원형',en:'Support'}, name:{ko:'의선',      en:'Physician'},  desc:{ko:'영약 조제·경혈 치료의 고수.',         en:'Master of elixirs and acupressure healing.'}},
    {id:'dh',role:{ko:'특수 — 희귀',en:'Special'},name:{ko:'달마 내공자',en:'Dharma'},desc:{ko:'마법·무협 융합 비정통 내공.',          en:'Unorthodox inner force fusing magic and martial arts.'}},

    {id:'ep',role:{ko:'지원형',en:'Support'}, name:{ko:'초능력 의사',en:'Psychic Healer'},desc:{ko:'감응으로 부상 진단·고통 흡수.',     en:'Diagnoses wounds via empathy, absorbs pain.'}},
    {id:'aw',role:{ko:'특수 — 희귀',en:'Special'},name:{ko:'각성자',en:'Awakened'},     desc:{ko:'새사람 프로젝트 탈출체.',             en:'Escaped subject of the New Human Project.'}},
  ],
};
// 대륙별 배경 문구 (직업 역할을 인자로 받는 함수)

function topStats(statsStr,n=2){
  const m={};statsStr.split(',').forEach(s=>{const t=s.trim().match(/^(\S+)\s+(\d+)/);if(t)m[t[1]]=+t[2];});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n)
    .map(([k,v])=>{const mod=Math.floor((v-10)/2);return `${k} ${v}(${mod>=0?'+':''}${mod})`;}).join(' · ');
}

async function saveGame() {
  const data = {
    character: { lang: CHAR.lang, cont: CHAR.cont, job: CHAR.job, stats: CHAR.stats },
    gameState: { hp: CHAR.hp, maxHp: CHAR.maxHp, mp: CHAR.mp, maxMp: CHAR.maxMp,
                 level: CHAR.level, xp: CHAR.xp, status: CHAR.status, companions: CHAR.companions },
    chapter:   document.getElementById('chapter-label').textContent,
    history:   history.slice(-10),
    savedAt:   Date.now(),
    turns:     history.length
  };

  // 비로그인 → 로컬 저장
  saveLocal(data);

  // 로그인 상태면 Firestore에도 저장
  if (!fbUser || !fbDb) { showSaveStatus('임시저장', 'ok'); return; }
  try {
    await fbDb.collection('saves').doc(fbUser.uid).set({
      ...data, savedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showSaveStatus('저장됨 ✓', 'ok');
  } catch(e) {
    showSaveStatus('저장 실패', 'err');
  }
}

async function loadSave() {
  // Firebase 우선 (로그인 상태)
  if (fbUser && fbDb) {
    try {
      const doc = await fbDb.collection('saves').doc(fbUser.uid).get();
      if (doc.exists) return doc.data();
    } catch(e) {}
  }
  // 로컬 폴백
  return loadLocal();
}

  const playerDex = getPlayerDex();

  const participants = [{
    type: 'player',
    id: CHAR.job,
    name: jobName,
    img: JOB_IMAGES_GP[CHAR.job] || null,

    hp: CHAR.hp, maxHp: CHAR.maxHp,

    const base = typeof getCompanion === 'function' ? getCompanion(comp.id) : null;
    const dexMatch = base?.stats.match(/DEX\s+(\d+)/);
    const compDex = dexMatch ? +dexMatch[1] : 12;
    participants.push({
      type: 'companion',
      id: comp.id,
      name: comp.name,
      img: comp.img || null,
      dex: compDex,
      hp: comp.hp, maxHp: comp.maxHp,
      status: comp.status,
    });
  });
  // 적 카드 (count만큼 반복)
  enemies.forEach(e => {
    const cr = typeof TERRA_NOVA_CREATURES !== 'undefined'
      ? TERRA_NOVA_CREATURES.find(c => c.id === e.id) : null;
    const eInfo = CREATURE_IMAGES[e.id];
    const eDex = cr ? Math.min(20, 6 + (cr.threat ?? 2) * 2) : 10;
    const cnt = Math.min(e.count ?? 1, 5);
    for (let i = 0; i < cnt; i++) {
      participants.push({
        type: 'enemy',
        id: e.id,
        name: eInfo ? eInfo.ko : e.id,
        img: eInfo ? eInfo.img : null,
        dex: eDex + Math.floor(Math.random() * 3),
        hp: cr?.combat?.hp ?? 100, maxHp: cr?.combat?.hp ?? 100,
        lv: e._rolled_level ?? cr?.level ?? '?',
      });
    }
  });
  // DEX 내림차순 정렬 (동점: 플레이어 → 동료 → 적)
  const typeOrder = { player: 0, companion: 1, enemy: 2 };
  participants.sort((a, b) => b.dex - a.dex || (typeOrder[a.type] ?? 2) - (typeOrder[b.type] ?? 2));
  return participants;
}

let _stripOrder = []; // 전투 중 initiative 순서 고정

function renderTurnStrip(enemies) {
  const strip = document.getElementById('turn-strip');
  if (!enemies || enemies.length === 0) {
    strip.classList.remove('show');
    if (COMBAT_ENEMIES.length > 0) { COMBAT_TURN = 0; _stripOrder = []; } // 전투 종료
    COMBAT_ENEMIES = [];
    return;
  }
  // 새 전투 시작 → 순서 재생성
  if (COMBAT_ENEMIES.length === 0) { COMBAT_TURN = 0; _stripOrder = buildInitiativeOrder(enemies); }
  COMBAT_ENEMIES = enemies;
  // 플레이어 HP 갱신
  const playerCard = _stripOrder.find(p => p.type === 'player');
  if (playerCard) { playerCard.hp = CHAR.hp; playerCard.maxHp = CHAR.maxHp; }

  const activeIdx = COMBAT_TURN % _stripOrder.length;
  strip.innerHTML = _stripOrder.map((p, i) => {
    const isActive = i === activeIdx;
    const hpPct = p.maxHp > 0 ? Math.round((p.hp / p.maxHp) * 100) : 0;
    const isPlayer = p.type === 'player';
    const isComp = p.type === 'companion';
    const isEnemy = p.type === 'enemy';
    const isDown = p.status === 'down';
    let cls = 'turn-card';
    if (isPlayer) cls += ' player';
    if (isComp)   cls += ' companion';
    if (isActive && !isDown) cls += ' active';
    if (isDown)   cls += ' down';
    const imgHtml = p.img
      ? `<img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">`
      : `<div style="height:72px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#3a3218">${isPlayer ? '⚔' : isComp ? '✦' : '☠'}</div>`;
    const badge = isPlayer ? `Lv.${CHAR.level}` : isComp ? (isDown ? 'DOWN' : '동료') : `Lv.${p.lv ?? '?'}`;
    const hpFillCls = isEnemy ? ' enemy' : isComp ? ' comp' : '';
    return `<div class="${cls}"><div style="overflow:hidden;height:72px">${imgHtml}</div><div class="turn-badge">${badge}</div><div class="turn-hp"><div class="turn-hp-fill${hpFillCls}" style="width:${hpPct}%"></div></div><div class="turn-card-name">${p.name}</div></div>`;
  }).join('');
  strip.classList.add('show');
  COMBAT_TURN++;
}

function showEnemyPanel(enemies) {
  const panel = document.getElementById('creature-panel');
  if (!enemies || enemies.length === 0) { panel.classList.remove('show'); return; }

  // Primary: highest-threat creature
  const crData = id => typeof TERRA_NOVA_CREATURES !== 'undefined'
    ? TERRA_NOVA_CREATURES.find(c => c.id === id) : null;
  let primary = enemies[0];
  for (const e of enemies) {
    const a = crData(e.id), b = crData(primary.id);
    if (a && b && (a.threat ?? 0) > (b.threat ?? 0)) primary = e;
  }

  const pInfo = CREATURE_IMAGES[primary.id];
  if (!pInfo) { panel.classList.remove('show'); return; }

  document.getElementById('creature-img').src = pInfo.img;
  document.getElementById('creature-img').alt = pInfo.ko;
  document.getElementById('creature-panel-name').textContent =
    pInfo.ko + (primary.count > 1 ? ` ×${primary.count}` : '');
  document.getElementById('creature-panel-en').textContent = pInfo.en;

  // Stats section: list all enemies
  let statsHtml = '';
  enemies.forEach((e, i) => {
    const eInfo = CREATURE_IMAGES[e.id];
    const cr = crData(e.id);
    const lv = e._rolled_level ?? cr?.level ?? '?';
    const countStr = (e.count ?? 1) > 1 ? ` ×${e.count}` : '';
    const nameStr = (eInfo?.ko || e.id) + countStr;
    if (i > 0) statsHtml += `<div style="border-top:1px solid #1a1810;margin-top:4px;padding-top:4px">${nameStr}<br>`;
    statsHtml += `Lv.${lv} ★${cr?.threat ?? '?'}`;
    if (cr?.combat) statsHtml += `<br>HP ${cr.combat.hp} · ATK ${cr.combat.atk}`;
    if (i > 0) statsHtml += '</div>';
    else statsHtml += '<br>';
  });
  document.getElementById('creature-panel-stats').innerHTML = statsHtml;
  panel.classList.add('show');
}

function showCreaturePanel(idOrEmpty) {
  if (!idOrEmpty) { showEnemyPanel([]); return; }
  showEnemyPanel([{id: idOrEmpty, count: 1, level_min: 1, level_max: 1}]);
}

async function callClaude(sys, msgs) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01'},
    body: JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:1200, system:sys, messages:msgs})
  });
  const d = await res.json();
  if (!res.ok) throw new Error(d.error?.message || `HTTP ${res.status}`);
  return d.content?.[0]?.text || '';
}

async function callGemini(sys, msgs) {
  const contents = msgs.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{text: m.content}]
  }));
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
    {method:'POST', headers:{'Content-Type':'application/json'},
     body: JSON.stringify({system_instruction:{parts:[{text:sys}]}, contents, generationConfig:{maxOutputTokens:1200, temperature:0.9}})}
  );
  const d = await res.json();
  if (!res.ok) throw new Error(d.error?.message || `HTTP ${res.status}`);
  return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function callOpenAI(sys, msgs) {

async function callGroq(sys, msgs) {

// ── JSON 파싱 ────────────────────────────────────────────────────────────
function safeParseGM(raw) {
  // 1) 마크다운 코드블록 제거 후 {} 범위 추출
  let text = raw.replace(/```json|```/g, '').trim();
  const start = text.indexOf('{');
  const end   = text.lastIndexOf('}');
  if (start !== -1 && end > start) text = text.slice(start, end + 1);

  // 2) 표준 파싱 시도
  try { return JSON.parse(text); } catch(_) {}

  // 3) JSON 문자열 값 안의 literal 줄바꿈·탭 교정 후 재시도
  //    "..." 안에서 이스케이프되지 않은 줄바꿈을 \n 로 치환
  try {
    const fixed = text.replace(/"((?:[^"\\]|\\.)*)"/gs, (_, inner) =>
      '"' + inner.replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t') + '"'
    );
    return JSON.parse(fixed);
  } catch(_) {}

  // 4) 파싱 완전 실패 → 텍스트를 story 로 그대로 표시
  return {
    chapter: document.getElementById('chapter-label').textContent,
    story:   raw,
    choices: ['계속 살핀다','다른 방향으로 간다','잠시 기다린다','상황을 파악한다'],
    hp_delta: 0, status: CHAR.status, items_gained: [], items_lost: []
  };
}
// ── 언어 혼용 감지 & 교정 ───────────────────────────────────────────────
// CJK 한자, 일본어 가나, 태국어, 아랍어 등 비한국어 문자 감지
function hasForeignChars(text) {
  // CJK U+4E00-9FFF, 히라가나 3040-309F, 카타카나 30A0-30FF, 태국어 0E00-0E7F, 아랍어 0600-06FF
  return /[\u4E00-\u9FFF\u3040-\u30FF\u0E00-\u0E7F\u0600-\u06FF]/.test(text);
}

// story + choices 필드만 골라서 교정 요청 (토큰 최소화)
async function repairForeignChars(parsed) {
  const suspect = { story: parsed.story || '', choices: parsed.choices || [] };
  const fixPrompt = `아래 JSON의 story와 choices에서 한국어가 아닌 문자(중국어 한자, 일본어 가나, 태국어, 아랍어 등)를 모두 한국어로 번역하세요. 수정된 story와 choices만 담은 순수 JSON을 반환하세요.\n${JSON.stringify(suspect)}`;
  try {
    const raw = await callAI(
      '한국어 텍스트 교정기. 비한국어 문자만 한국어로 변환. 순수 JSON만 반환.',
      [{ role: 'user', content: fixPrompt }]
    );
    const fix = JSON.parse(raw.replace(/```json|```/g, '').trim());
    if (fix.story)   parsed.story   = fix.story;
    if (fix.choices) parsed.choices = fix.choices;
  } catch(e) { /* 교정 실패 시 원본 유지 */ }
  return parsed;
}

// 히스토리를 오염시키지 않고 AI 전송 시에만 언어 힌트 추가
function buildHistoryForAI() {
  if (CHAR.lang !== 'ko') return history;
  return history.map((m, i) =>
    (i === history.length - 1 && m.role === 'user')
      ? { ...m, content: m.content + '\n[반드시 순수 한국어로만 응답. 한자·가나·태국어 등 비한국어 문자 절대 사용 금지]' }
      : m
  );
}

async function callGM(userMsg) {
  if(isLoading) return;
  if(!API_KEY) { document.getElementById('api-setup').style.display='block'; return; }
  isLoading = true;
  setUI(false);
  showLoading();
  history.push({role:'user', content: userMsg});

  try {
    const raw = await callAI(buildSystemPrompt(), buildHistoryForAI());
    history.push({role:'assistant', content: raw});

    let parsed = safeParseGM(raw);

    // 비한국어 문자가 감지되면 교정 요청
    if (CHAR.lang === 'ko' &&
        (hasForeignChars(parsed.story || '') || parsed.choices?.some(c => hasForeignChars(c)))) {
      parsed = await repairForeignChars(parsed);
    }

    applyResult(parsed, userMsg);

  } catch(err) {
    document.getElementById('story-text').innerHTML =
      `<p style="color:#e06060">오류: ${err.message}</p><p style="color:#5a5030;font-size:11px">API 키를 확인하거나 잠시 후 다시 시도하세요.</p>`;
    renderChoices(['다시 시도']);
    document.querySelector('.choice-btn')?.addEventListener('click', () => callGM(userMsg));
  }
  isLoading = false;
  setUI(true);
}

function applyResult(p, userMsg) {
  if (p.hp_delta) {
    CHAR.hp = Math.max(0, Math.min(CHAR.maxHp, CHAR.hp + p.hp_delta));
  }
  if (p.mp_delta) {
    CHAR.mp = Math.max(0, Math.min(CHAR.maxMp, CHAR.mp + p.mp_delta));
  }
  if (p.xp_gained && p.xp_gained > 0 && CHAR.level < 12) {
    CHAR.xp += p.xp_gained;
    const newLevel = typeof calcLevel === 'function' ? calcLevel(CHAR.xp) : CHAR.level;
    if (newLevel > CHAR.level) {
      const oldLevel = CHAR.level;
      CHAR.level = newLevel;
      const hpBefore = CHAR.maxHp;
      const mpBefore = CHAR.maxMp;
      if (typeof calcMaxHp === 'function') {
        CHAR.maxHp = calcMaxHp(CHAR.job, CHAR.level, CHAR.stats);
        CHAR.hp = Math.min(CHAR.hp + (CHAR.maxHp - hpBefore), CHAR.maxHp);
        CHAR.maxMp = calcMaxMp(CHAR.job, CHAR.level, CHAR.stats);
        CHAR.mp = Math.min(CHAR.mp + (CHAR.maxMp - mpBefore), CHAR.maxMp);
      }
      setTimeout(() => {
        const el = document.getElementById('story-text');
        const notice = document.createElement('p');
        notice.style.cssText = 'color:#c8b97a;border:1px solid #c8b97a44;padding:8px;margin-top:12px;font-family:Noto Sans KR,sans-serif;font-size:12px;letter-spacing:0.1em';
        notice.textContent = `★ 레벨 업! Lv ${oldLevel} → Lv ${CHAR.level} — 최대 HP/MP가 증가했습니다.`;
        el.appendChild(notice);
      }, 100);
    }
  }
  // enemies 배열(신규) 또는 creature_id(구버전 호환) 처리
  const rawEnemies = (p.enemies && p.enemies.length > 0) ? p.enemies
    : (p.creature_id ? [{id: p.creature_id, count: 1, level_min: 1, level_max: 1}] : []);
  const rolledEnemies = rawEnemies.map(e => {
    const min = e.level_min ?? 1;
    const max = e.level_max ?? min;
    return {...e, _rolled_level: min + Math.floor(Math.random() * (max - min + 1))};
  });

  // 동료 영입
  if (p.companion_recruit && typeof getCompanion === 'function') {
    const base = getCompanion(p.companion_recruit);
    if (base && !CHAR.companions.find(c => c.id === base.id)) {
      CHAR.companions.push({
        id: base.id, name: base.name.ko, img: base.img,
        hp: base.maxHp, maxHp: base.maxHp, maxMp: base.maxMp,
        status: 'active',
      });
      setTimeout(() => {
        const el = document.getElementById('story-text');
        const notice = document.createElement('p');
        notice.style.cssText = 'color:#5dcaa5;border:1px solid #5dcaa544;padding:8px;margin-top:12px;font-family:Noto Sans KR,sans-serif;font-size:12px;letter-spacing:0.1em';
        notice.textContent = `✦ ${base.name.ko}이(가) 동료로 합류했습니다!`;
        el.appendChild(notice);
      }, 100);
    }
  }
  // 동료 상태 갱신
  if (p.companion_state?.length) {
    p.companion_state.forEach(cs => {
      const comp = CHAR.companions.find(c => c.id === cs.id);
      if (!comp) return;
      if (comp.status === 'dead') return;
      if (cs.hp_delta) comp.hp = Math.max(0, Math.min(comp.maxHp, comp.hp + cs.hp_delta));
      if (cs.status) {
        if (comp.status === 'down' && cs.status === 'dead') comp.status = 'dead';
        else if (cs.status !== 'dead') comp.status = cs.status;
      }
    });
    // 전투 종료 시 down → 1HP로 회복
    if (!rolledEnemies.length) {
      CHAR.companions.forEach(c => { if (c.status === 'down') { c.hp = 1; c.status = 'active'; } });
    }
  }

  updateHUD();
  if (p.status?.length) {
    CHAR.status = p.status;
    document.getElementById('status-tags').innerHTML = p.status.map(s=>`<span class="stag">${s}</span>`).join('');
  }
  if(p.chapter) document.getElementById('chapter-label').textContent = p.chapter;

  showEnemyPanel(rolledEnemies);
  renderTurnStrip(rolledEnemies);

  const el = document.getElementById('story-text');
  el.innerHTML = (p.story||'').split('\n\n').map(para=>`<p>${para}</p>`).join('');

  renderChoices(p.choices||[]);

  if(userMsg) {
    logItems.push({choice: userMsg, story: (p.story||'').slice(0,80)+'…'});
    renderLog();
  }
  saveGame();
}

function renderChoices(choices) {
  const el = document.getElementById('choices');
  el.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-num">${i+1}.</span><span>${c}</span>`;
    btn.addEventListener('click', () => { if(!isLoading) callGM(c); });
    el.appendChild(btn);
  });

function setUI(enabled) {

// 저장된 데이터를 현재 세션에 적용
function applyResume(save) {
  const gs    = save.gameState || {};
  CHAR.level  = gs.level  ?? 1;
  CHAR.xp     = gs.xp     ?? 0;
  CHAR.maxHp  = gs.maxHp  ?? (typeof calcMaxHp === 'function' ? calcMaxHp(CHAR.job, CHAR.level, CHAR.stats) : 100);
  CHAR.hp     = gs.hp     ?? CHAR.maxHp;
  CHAR.maxMp  = gs.maxMp  ?? (typeof calcMaxMp === 'function' ? calcMaxMp(CHAR.job, CHAR.level, CHAR.stats) : 50);
  CHAR.mp     = gs.mp     ?? CHAR.maxMp;
  CHAR.status = gs.status ?? ['정상'];
  CHAR.companions = gs.companions ?? [];
  history     = save.history || [];
  updateHUD();
  document.getElementById('status-tags').innerHTML =
    CHAR.status.map(s=>`<span class="stag">${s}</span>`).join('');
  if (save.chapter) document.getElementById('chapter-label').textContent = save.chapter;
  callGM('게임을 이어합니다. 직전 상황을 한 문장으로 간략히 요약한 뒤 바로 다음 장면을 시작해주세요.');
}

// 이어하기 배너 표시
let _pendingSave = null;
function showResumeBanner(save) {
  _pendingSave = save;
  const turns = save.turns ?? save.history?.length ?? 0;
  const chap  = save.chapter && save.chapter !== '— 대기 중 —' ? save.chapter : '';
  const info  = chap ? `${chap} (${turns}턴)` : `${turns}턴 진행됨`;
  document.getElementById('resume-msg').textContent = `저장된 진행 상황이 있습니다 — ${info}`;
  document.getElementById('resume-banner').classList.add('show');
}
function hideResumeBanner() {
  document.getElementById('resume-banner').classList.remove('show');
  _pendingSave = null;
}

document.getElementById('resume-yes').addEventListener('click', () => {
  if (_pendingSave) applyResume(_pendingSave);
  hideResumeBanner();
});
document.getElementById('resume-no').addEventListener('click', hideResumeBanner);

// 포커스/화면 복귀 시 저장 상태 확인
let _lastFocusCheck = 0;
async function checkResume() {
  if (isLoading) return;
  const now = Date.now();
  if (now - _lastFocusCheck < 5000) return; // 5초 디바운스
  _lastFocusCheck = now;

  const save = await loadSave();
  if (!save) return;
  if (save.character?.cont !== CHAR.cont || save.character?.job !== CHAR.job) return;
  const savedTurns   = save.turns ?? save.history?.length ?? 0;
  const currentTurns = history.length;
  if (savedTurns > currentTurns) showResumeBanner(save);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkResume();
});
window.addEventListener('focus', checkResume);

async function startGame() {
  const save = await loadSave();
  if (save && save.character?.cont === CHAR.cont && save.character?.job === CHAR.job
      && (save.turns ?? save.history?.length ?? 0) > 0) {
    _lastFocusCheck = Date.now(); // checkResume 이중 실행 방지
    showResumeBanner(save);
    // 배너를 보여주고 사용자 선택 대기 — 새 게임은 '무시' 클릭 시 시작
    document.getElementById('resume-no').addEventListener('click', () => {
      callGM(`게임을 시작합니다. 테라 노바의 첫 장면을 시작해주세요. ${jobName}(${contName} 출신)으로서 테라 노바에 막 도착한 상황으로 시작해 주세요.`);
    }, { once: true });
    return;
  }
  callGM(`게임을 시작합니다. 테라 노바의 첫 장면을 시작해주세요. ${jobName}(${contName} 출신)으로서 테라 노바에 막 도착한 상황으로 시작해 주세요.`);
}

// HUD 초기값 표시
updateHUD();

// API 키 있으면 바로 시작
if(API_KEY) startGame();
</script>
</body>
