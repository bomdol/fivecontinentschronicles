<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오대륙전기 — 캐릭터 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;900&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a08;min-height:100vh}
.root{font-family:'Noto Serif KR',serif;background:#0a0a08;color:#c8b97a;padding:0;max-width:680px;margin:0 auto}
.card{border:1px solid #2a2518;padding:13px 12px;cursor:pointer;background:#0e0e0b;transition:border-color 0.15s,background 0.15s}
.card:hover{border-color:#5a4e28;background:#111109}
.card.sel{border-color:#c8b97a;background:#151510}
.nbtn{padding:10px 22px;background:#141410;border:1px solid #5a4e28;color:#9a8e52;font-family:'Noto Serif KR',serif;font-size:12px;letter-spacing:0.18em;cursor:pointer;display:inline-block}
.nbtn:hover{border-color:#c8b97a;color:#c8b97a;background:#1e1c10}
.nbtn.p{border-color:#c8b97a;color:#c8b97a}
.nbtn.p:hover{background:#1e1c14;color:#e8d48a}
.nbtn.off{opacity:0.3;cursor:default;pointer-events:none}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
/* 언어 */
.lang-screen{padding:28px 16px}
.game-logo{font-size:24px;font-weight:900;letter-spacing:0.2em;color:#e8d48a;text-align:center;margin-bottom:4px}
.game-sub{font-size:10px;letter-spacing:0.45em;color:#5a5130;text-align:center;margin-bottom:20px}
.lang-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.lcard{border:1px solid #2a2518;padding:9px 6px;cursor:pointer;background:#0e0e0b;text-align:center;transition:border-color 0.15s;position:relative}
.lcard:hover{border-color:#5a4e28;background:#111109}
.lcard.sel{border-color:#c8b97a;background:#151510}
.lcard.sel::after{content:'✓';position:absolute;top:3px;right:5px;font-size:9px;color:#c8b97a}
.lcard.builtin{border-color:#2a3828}
.lcard.builtin.sel{border-color:#5dcaa5}
.lflag{font-size:16px;margin-bottom:3px}
.lnative{font-size:10px;font-weight:500;color:#c8b97a}
.lcard.sel .lnative{color:#e8d48a}
.lname-small{font-size:9px;color:#5a5030}
.lbadge{font-size:8px;padding:1px 3px;margin-top:3px;display:inline-block}
.badge-b{background:#0a1f0a;border:1px solid #1a4a1a;color:#5dcaa5}
.badge-a{background:#0a0a1a;border:1px solid #1a1a3a;color:#6868aa}
.lang-notice{font-size:10px;color:#5a5030;text-align:center;margin-bottom:14px;line-height:1.7;font-family:'Noto Sans KR',sans-serif}
/* 인트로 */
.intro-screen{padding:28px 16px;text-align:center}
.ascii-art{font-family:'Courier New',monospace;font-size:11px;line-height:1.2;color:#c8b97a;white-space:pre;margin-bottom:16px}
.intro-title{font-size:28px;font-weight:900;letter-spacing:0.2em;color:#e8d48a;margin-bottom:6px}
.intro-sub{font-size:11px;letter-spacing:0.4em;color:#5a5130;margin-bottom:14px;font-family:'Noto Sans KR',sans-serif}
.intro-divider{width:160px;height:1px;background:#c8b97a33;margin:0 auto 14px}
.intro-lore{font-size:12px;color:#8a7e52;line-height:1.9;max-width:420px;margin:0 auto 20px;font-family:'Noto Sans KR',sans-serif}
.intro-btn{padding:12px 36px;background:transparent;border:1px solid #c8b97a66;color:#c8b97a;font-family:'Noto Serif KR',serif;font-size:13px;letter-spacing:0.3em;cursor:pointer;transition:all 0.3s}
.intro-btn:hover{background:#c8b97a18;border-color:#c8b97a;letter-spacing:0.4em}
/* 캐릭터 */
.char-screen{padding:20px 16px 28px}
.step-header{text-align:center;margin-bottom:18px}
.step-label{font-size:10px;letter-spacing:0.4em;color:#5a5130;font-family:'Noto Sans KR',sans-serif;margin-bottom:5px}
.step-title{font-size:17px;font-weight:900;letter-spacing:0.2em;color:#e8d48a}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.dot{width:24px;height:2px;background:#2a2518}
.dot.on{background:#c8b97a}
.dot.done{background:#6a5e35}
.cont-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cont-wrap .card{position:relative}
.cont-wrap .card.sel::after{content:'✓';position:absolute;top:7px;right:9px;font-size:11px;color:#c8b97a}
.ci{font-size:20px;margin-bottom:7px}
.cn{font-size:13px;font-weight:600;letter-spacing:0.1em;color:#c8b97a;margin-bottom:2px}
.card.sel .cn{color:#e8d48a}
.cf{font-size:9px;color:#5a5130;letter-spacing:0.18em;font-family:'Noto Sans KR',sans-serif;margin-bottom:6px}
.cd{font-size:11px;color:#5a5030;line-height:1.55;font-family:'Noto Sans KR',sans-serif}
.card.sel .cd{color:#8a7e52}
.ctags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.ctag{font-size:9px;padding:2px 6px;border:1px solid #2a2518;color:#6a6040;font-family:'Noto Sans KR',sans-serif}
.job-wrap{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.job-wrap .card{display:grid;grid-template-columns:44px 1fr 76px;gap:10px;align-items:start}
.jasc{font-family:'Courier New',monospace;font-size:7.5px;line-height:1.3;color:#3a3218;white-space:pre;text-align:center}
.card.sel .jasc{color:#7a6e45}
.jn{font-size:13px;font-weight:600;color:#c8b97a;margin-bottom:2px}
.card.sel .jn{color:#e8d48a}
.jr{font-size:9px;letter-spacing:0.18em;color:#5a5130;margin-bottom:4px;font-family:'Noto Sans KR',sans-serif}
.jd{font-size:11px;color:#5a5030;line-height:1.5;font-family:'Noto Sans KR',sans-serif}
.card.sel .jd{color:#8a7e52}
.sp-badge{font-size:9px;padding:1px 6px;border:1px solid #5a4e28;color:#9a8e52;display:inline-block;margin-bottom:3px;font-family:'Noto Sans KR',sans-serif}
.smr{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.sml{font-size:9px;color:#5a5130;width:20px;font-family:'Noto Sans KR',sans-serif}
.smt{flex:1;height:2px;background:#1a1810}
.smf{height:100%;background:#5a5030}
.card.sel .smf{background:#c8b97a}
.pool-banner{display:flex;align-items:center;justify-content:space-between;border:1px solid #3a3018;background:#111008;padding:12px 16px;margin-bottom:14px}
.pool-num{font-size:28px;font-weight:900;color:#e8d48a;line-height:1}
.pool-lbl{font-size:10px;color:#6a6040;margin-top:3px;font-family:'Noto Sans KR',sans-serif}
.pool-rule{font-size:10px;color:#6a6040;font-family:'Noto Sans KR',sans-serif;text-align:right;line-height:1.8}
.pool-rule b{color:#c8b97a}
.stat-rows{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.srow{display:grid;grid-template-columns:50px 1fr 28px 52px 28px 64px;gap:5px;align-items:center}
.srow-name{font-size:11px;color:#c8b97a;line-height:1.3;font-family:'Noto Sans KR',sans-serif}
.srow-eng{font-size:8px;color:#5a5130;display:block}
.srow-bar-wrap{height:4px;background:#1a1810;border-radius:2px;overflow:hidden}
.srow-bar-fill{height:100%;border-radius:2px;transition:width 0.15s}
.srow-btn{width:26px;height:26px;background:#141410;border:1px solid #5a4e28;color:#c8b97a;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:monospace}
.srow-btn:hover:not(:disabled){background:#1e1c10;border-color:#c8b97a}
.srow-btn:disabled{opacity:0.2;cursor:default}
.srow-mid{display:flex;flex-direction:column;align-items:center;gap:1px}
.srow-val{font-size:18px;font-weight:900;color:#e8d48a;line-height:1;font-family:'Noto Serif KR',serif}
.srow-base{font-size:9px;color:#4a4828;font-family:'Noto Sans KR',sans-serif}
.srow-delta{font-size:9px;font-family:'Noto Sans KR',sans-serif}
.delta-up{color:#5dcaa5}
.delta-dn{color:#e06060}
.srow-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tag-mod{font-size:10px;padding:2px 6px;background:#1a1610;border:1px solid #4a3e18;color:#c8a84a;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.tag-bon{font-size:9px;padding:1px 5px;background:#0a0a1f;border:1px solid #2a2a4a;color:#8888dd;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.summary-box{border:1px solid #2a2518;padding:10px 14px;background:#0e0e0b;margin-bottom:12px;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:#8a7e52;line-height:1.85}
.summary-box b{color:#e8d48a;font-family:'Noto Serif KR',serif}
</style>
</head>

  zh:{title:'五 大 陆 战 记',sub:'FIVE CONTINENTS CHRONICLES',langSel:'选择语言',langConfirm:'用中文开始',lore:'太初盘古大陆分裂为五片土地。\n其中空旷之地——特拉诺瓦——\n埋藏着铁矿，生长着灵药，沉睡着龙。\n如今四大陆的剑、魔法与内功\n在那片土地上交锋...',startBtn:'— 开 始 游 戏 —',s1:'选择大陆',s2:'选择职业',s3:'分配能力值',next:'下一步 →',back:'← 返回',statStart:'开始冒险 →',pool:'剩余点数',maxDelta:'职业基础值最大±2',poolRule:'− 加点数 · + 扣点数',modLabel:'调整值',bonLabel:'大陆',sumMore:'剩余',sumLeft:'点',sumDone:'点数已全部分配'},

      const d=G.delta[s];const bv=base[s]||10;const fv=finalVal(s);const mod=Math.floor((fv-10)/2);const ms=mod>=0?`+${mod}`:`${mod}`;const bon=cb[s]||0;const barPct=Math.round((fv/20)*100);const canUp=d<MAX_D&&G.pool>0;const canDn=d>-MAX_D;
      let dstr='';if(d>0)dstr=`<span class="srow-delta delta-up"> +${d}</span>`;else if(d<0)dstr=`<span class="srow-delta delta-dn"> ${d}</span>`;
      h+=`<div class="srow"><div class="srow-name">${s}<span class="srow-eng">${SL[s]}</span></div><div class="srow-bar-wrap"><div class="srow-bar-fill" style="width:${barPct}%;background:${barColor(fv)}"></div></div><button class="srow-btn" data-dn="${s}" ${canDn?'':'disabled'}>−</button><div class="srow-mid"><div class="srow-val">${fv}${dstr}</div><div class="srow-base">기본 ${bv}</div></div><button class="srow-btn" data-up="${s}" ${canUp?'':'disabled'}>+</button><div class="srow-right"><span class="tag-mod">${t.modLabel} ${ms}</span>${bon>0?`<span class="tag-bon">${t.bonLabel} +${bon}</span>`:''}</div></div>`;
    });
    h+=`</div><div class="summary-box">대륙: <b>${L(cobj?.name)}</b> | 직업: <b>${L(jobj?.name)}</b><br>${G.pool>0?`${t.sumMore} <b>${G.pool}</b>${t.sumLeft}`:t.sumDone}</div><div class="nav"><button class="nbtn" data-go="3">${t.back}</button><button class="nbtn p" data-start="1">${t.statStart}</button></div></div>`;
  }
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>{G.lang=el.dataset.lang;render();}));
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{const n=+el.dataset.go;if(n===3&&!G.cont)return;if(n===4&&!G.job)return;if(n===4)resetStat();G.screen=n;render();}));
  document.querySelectorAll('[data-cont]').forEach(el=>el.addEventListener('click',()=>{G.cont=el.dataset.cont;G.job=null;resetStat();render();}));
  document.querySelectorAll('[data-job]').forEach(el=>el.addEventListener('click',()=>{G.job=el.dataset.job;resetStat();render();}));
  document.querySelectorAll('[data-up]').forEach(el=>el.addEventListener('click',()=>{const s=el.dataset.up;if(G.delta[s]>=MAX_D||G.pool<=0)return;G.delta[s]++;G.pool--;render();}));
  document.querySelectorAll('[data-dn]').forEach(el=>el.addEventListener('click',()=>{const s=el.dataset.dn;if(G.delta[s]<=-MAX_D)return;G.delta[s]--;G.pool++;render();}));
  const sb=document.querySelector('[data-start]');
  if(sb)sb.addEventListener('click',()=>{
    const statStr=SN.map(s=>`${s} ${finalVal(s)}`).join(', ');
    const charData={lang:G.lang,cont:G.cont,job:G.job,stats:statStr};
    sessionStorage.setItem('fcc_char',JSON.stringify(charData));
    window.location.href=`02_gameplay.html?lang=${G.lang}&cont=${G.cont}&job=${G.job}&stats=${encodeURIComponent(statStr)}`;
  });
}
render();
</script>
</body>
</html>
